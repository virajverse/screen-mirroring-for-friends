<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AirCast Mobile Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/viewer.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📱</text></svg>">
</head>
<body class="theme-oled">
  <!-- Top Minimal Floating Nav -->
  <header class="viewer-header" id="viewerHeader">
    <div class="brand-badge">
      <span class="live-dot" id="liveDot"></span>
      <span class="brand-title">AirCast</span>
      <span class="stream-state-tag" id="streamStateTag">Connecting...</span>
    </div>
    
    <div class="header-actions">
      <!-- Change Room Button -->
      <button class="room-pill-btn" id="openRoomModalBtn" title="Change Room ID">
        <span>Room:</span>
        <strong id="headerRoomId">default</strong>
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>

      <!-- WakeLock Status -->
      <button class="icon-btn" id="wakeLockBtn" title="Keep screen awake">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
      </button>

      <!-- Telemetry Toggle -->
      <button class="icon-btn" id="toggleHudBtn" title="Toggle Stats HUD">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 20V10M12 20V4M6 20v-6"></path>
        </svg>
      </button>

      <!-- Fullscreen Button -->
      <button class="icon-btn" id="fullscreenBtn" title="Fullscreen">
        <svg id="enterFsIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
        <svg id="exitFsIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Live Stats Telemetry HUD Overlay -->
  <div class="telemetry-hud" id="telemetryHud" style="display: none;">
    <div class="hud-item"><span class="hud-lbl">PING:</span> <span class="hud-val" id="hudPing">-- ms</span></div>
    <div class="hud-item"><span class="hud-lbl">FPS:</span> <span class="hud-val" id="hudFps">--</span></div>
    <div class="hud-item"><span class="hud-lbl">RES:</span> <span class="hud-val" id="hudRes">--</span></div>
    <div class="hud-item"><span class="hud-lbl">ROOM:</span> <span class="hud-val" id="hudRoom">default</span></div>
    <div class="hud-item"><span class="hud-lbl">ZOOM:</span> <span class="hud-val" id="hudZoom">1.0x</span></div>
  </div>

  <!-- Main Viewport Stage -->
  <main class="viewer-stage" id="viewerStage">
    <!-- Pinch & Pan Transform Wrapper -->
    <div class="transform-container" id="transformContainer">
      <img id="remoteImage" class="remote-screen-img" alt="Host Screen Stream" src="" style="display: none;" />
    </div>

    <!-- Waiting State Screen -->
    <div class="waiting-state" id="waitingState">
      <div class="waiting-card">
        <div class="pulse-ring">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <h2 id="waitingTitle">Connecting to Server...</h2>
        <p id="waitingDesc">Establishing real-time cloud connection.</p>

        <!-- Room Input Form inside Waiting Card -->
        <div class="room-input-card">
          <label for="roomCodeInput" class="room-input-label">Room ID / PIN:</label>
          <div class="room-input-row">
            <input type="text" id="roomCodeInput" placeholder="e.g. default or AIR-1234" maxlength="20" value="default" />
            <button type="button" id="applyRoomBtn" class="btn-join-room">Join</button>
          </div>
        </div>

        <!-- Status Steps -->
        <div class="status-steps">
          <div class="status-step" id="stepServer">
            <span class="step-icon active" id="stepServerIcon">●</span>
            <span id="stepServerText">Cloud Server: Connecting...</span>
          </div>
          <div class="status-step" id="stepHost">
            <span class="step-icon pending" id="stepHostIcon">○</span>
            <span id="stepHostText">Host Laptop: Waiting...</span>
          </div>
          <div class="status-step" id="stepStream">
            <span class="step-icon pending" id="stepStreamIcon">○</span>
            <span id="stepStreamText">Screen Stream: Inactive</span>
          </div>
        </div>

        <button class="reconnect-btn" id="reconnectBtn" style="display:none;" onclick="location.reload()">
          🔄 Reconnect
        </button>
      </div>
    </div>
  </main>

  <!-- Bottom Floating Tool Dock -->
  <nav class="floating-dock" id="floatingDock">
    <!-- Room Switch Dock Button -->
    <button class="dock-btn" id="dockRoomBtn" title="Switch Room">
      <div class="dock-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </div>
      <span class="dock-label">Room</span>
    </button>

    <!-- Zoom Reset -->
    <button class="dock-btn" id="resetZoomBtn" title="Reset Zoom">
      <div class="dock-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      </div>
      <span class="dock-label" id="zoomLevelLabel">100%</span>
    </button>

    <!-- Snapshot -->
    <button class="dock-btn" id="snapshotBtn" title="Take Screenshot">
      <div class="dock-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <span class="dock-label">Snapshot</span>
    </button>

    <!-- Fit / Stretch Mode -->
    <button class="dock-btn" id="fitModeBtn" title="Fit to Screen">
      <div class="dock-icon">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <polyline points="9 3 9 21"></polyline>
        </svg>
      </div>
      <span class="dock-label" id="fitModeLabel">Fit</span>
    </button>
  </nav>

  <!-- Room Switch Modal Overlay -->
  <div class="modal-overlay" id="roomModal" style="display: none;">
    <div class="modal-card">
      <h3>Switch Room</h3>
      <p>Enter the Room ID or PIN from the Host Laptop dashboard:</p>
      <div class="room-input-row" style="margin: 1rem 0;">
        <input type="text" id="modalRoomInput" placeholder="e.g. AIR-8921" maxlength="20" />
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="cancelModalBtn">Cancel</button>
        <button type="button" class="btn btn-confirm" id="confirmModalBtn">Connect</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Real-time Socket.IO Connection -->
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script>
    if (typeof io === 'undefined') {
      document.write('<script src="/socket.io/socket.io.js"><\/script>');
    }
  </script>
  <script src="/js/viewer.js"></script>
</body>
</html>
